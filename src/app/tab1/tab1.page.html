<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Países</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div *ngIf="cargando" class="ion-text-center ion-padding">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <ion-item *ngIf="error" color="danger">
    <ion-label>No se pudieron cargar los países. Intentá de nuevo.</ion-label>
  </ion-item>

  <ion-list *ngIf="!cargando && !error">
    <ion-item *ngFor="let pais of countries">
      <ion-label>
        <h2>{{ pais.flag }} {{ pais.name.common }}</h2>
        <p>{{ pais.capital?.[0] }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
